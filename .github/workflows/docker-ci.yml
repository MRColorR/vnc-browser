name: Build, Test & Push images

on:
  pull_request:
  push:
    branches: [main]
    tags:
      - "*.*.*"
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_NAME: ${{ vars.IMAGE_NAME }}

jobs:
  test:
    name: Test ${{ matrix.variant }} on ${{ matrix.arch.platform }}
    runs-on: ${{ matrix.arch.runner }}
    strategy:
      fail-fast: false
      matrix:
        variant: [debian, alpine]
        arch:
          - platform: amd64
            runner: ubuntu-24.04
          - platform: arm64
            runner: ubuntu-24.04-arm
    env:
      VARIANT: ${{ matrix.variant }}
      ARCH: ${{ matrix.arch.platform }}
      BROWSER: ${{ matrix.variant == 'debian' && 'chromium' || 'firefox' }}
      IMAGE: ${{ vars.IMAGE_NAME }}:${{ matrix.variant }}-${{ github.ref_name }}-${{ matrix.arch.platform }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build native image
        run: |
          if [[ "$ARCH" == amd64 ]]; then expected=x86_64; else expected=aarch64; fi
          test "$(uname -m)" = "$expected"
          docker build --pull --platform "linux/$ARCH" \
            --build-arg "PACKAGE_REFRESH=$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            --label "org.opencontainers.image.title=VNC Browser ($VARIANT)" \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.version=$GITHUB_REF_NAME" \
            --file "$VARIANT.dockerfile" --tag vnc-browser:test .

      - name: Test startup, theme, shutdown and profile persistence
        run: python3 tests/test_container.py vnc-browser:test "$BROWSER"

      - name: Log in to Docker Hub
        if: github.ref_type == 'tag'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push the tested architecture image
        if: github.ref_type == 'tag'
        run: |
          docker tag vnc-browser:test "$IMAGE"
          docker push "$IMAGE"

  publish:
    name: Publish multi-platform tags
    if: github.ref_type == 'tag'
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - name: Log in to Docker Hub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Publish versioned and rolling Docker Hub tags
        run: |
          for variant in debian alpine; do
            versioned="$IMAGE_NAME:$variant-$GITHUB_REF_NAME"
            tags=(--tag "$versioned" --tag "$IMAGE_NAME:$variant")
            if [[ "$variant" == debian ]]; then tags+=(--tag "$IMAGE_NAME:latest"); fi
            docker buildx imagetools create "${tags[@]}" "$versioned-amd64" "$versioned-arm64"
          done
